# Modified from the original gpui-component project in commit 4caf2023.
# Changes:
# - Added the `visual-test` feature backed by GPUI and gpui_platform test support.
# - Registered four shadcn capture examples that require the visual-test feature.
[package]
name = "hearth-gpui-story"
version = "0.5.1"
publish = false
edition.workspace = true

[features]
inspector = ["hearth-gpui/inspector"]
tree-sitter = ["hearth-gpui/tree-sitter-languages"]
visual-test = ["gpui/test-support", "gpui_platform/test-support"]
default = ["tree-sitter"]

[dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
hearth-gpui = { workspace = true }
hearth-gpui-assets.workspace = true

autocorrect = "2.14.2"
chrono = "0.4"
csv = "1.4"
fake = { version = "2.10.0", features = ["dummy"] }
itertools = "0.14.0"
lsp-types.workspace = true
rand = "0.8"
regex = "1"
serde = "1"
serde_json = "1"
tracing.workspace = true
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "registry"], default-features = false }
unindent = "0.2.3"
rust-i18n.workspace = true
dirs = "6.0.0"

# Native-only dependencies (not available on WASM)
[target.'cfg(not(target_family = "wasm"))'.dependencies]
reqwest_client.workspace = true
smol.workspace = true
tree-sitter-navi = "0.2.3"
color-lsp = "0.2.0"

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web.workspace = true
# `rand 0.8` (via `fake`) does not enable the `js` feature of getrandom,
# which is required to build for wasm32-unknown-unknown.
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18" }

[lints]
workspace = true

[[example]]
name = "shadcn_capture"
required-features = ["visual-test"]

[[example]]
name = "shadcn_phase0_capture"
required-features = ["visual-test"]

[[example]]
name = "shadcn_overlay_capture"
required-features = ["visual-test"]

[[example]]
name = "shadcn_locale_capture"
required-features = ["visual-test"]
